name: Build JARVIS V2 APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      # 1. Code checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. ZIP extract karo (agar hai to)
      - name: Extract ZIP if present
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" -type f | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            unzip -o "$ZIP_FILE" -d extracted/
            if [ -f "extracted/main.py" ]; then
              mv extracted/* . 2>/dev/null || true
            fi
            rm -rf extracted
          fi
          ls -la

      # 3. Python setup
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 4. Dependencies install (pyproject se)
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.24.1 groq==0.11.0 SpeechRecognition==3.10.4 pyttsx3==2.98 gTTS==2.5.1 pygame==2.6.1 python-dotenv==1.0.1 Pillow

      # 5. Icons setup (logo.png se)
      - name: Setup Icons
        run: |
          if [ ! -d "assets" ]; then mkdir -p assets; fi
          if [ ! -f "assets/logo.png" ]; then
            python -c "from PIL import Image, ImageDraw; img = Image.new('RGBA', (1024, 1024), (10, 14, 26, 255)); d = ImageDraw.Draw(img); d.ellipse([112, 112, 912, 912], fill='#0a0e1a', outline='#00d4ff', width=16); d.ellipse([320, 400, 460, 540], fill='#00d4ff'); d.ellipse([564, 400, 704, 540], fill='#00d4ff'); d.rectangle([400, 680, 624, 720], fill='#00d4ff'); d.line([512, 112, 512, 40], fill='#00d4ff', width=12); d.ellipse([492, 12, 532, 52], fill='#00d4ff'); img.save('assets/logo.png')"
          fi
          python -c "from PIL import Image; img = Image.open('assets/logo.png').convert('RGBA'); img = img.resize((1024, 1024), Image.LANCZOS); img.save('assets/logo.png')"
          cp assets/logo.png assets/icon.png

      # 6. APK Build (Official Flet Action)
      - name: Build APK
        id: build
        uses: flet-dev/flet-build-action@v1
        with:
          target: 'apk'
          build-version: '2.0.0'
          build-number: '1'

      # 7. APK Upload
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-V2-APK
          path: ${{ steps.build.outputs.archive-path }}
          archive: false
          if-no-files-found: error
