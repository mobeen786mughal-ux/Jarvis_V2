name: Build JARVIS V2 APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. ZIP Extract karo
      - name: Extract ZIP if present
        run: |
          echo "🔍 Searching for zip file..."
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" -type f | head -n 1)
          
          if [ -n "$ZIP_FILE" ]; then
            echo "📦 Found $ZIP_FILE, extracting..."
            unzip -o "$ZIP_FILE" -d extracted/
            
            if [ -f "extracted/main.py" ]; then
              mv extracted/* . 2>/dev/null || true
            else
              SUBDIR=$(find extracted -maxdepth 2 -name "main.py" -type f | head -n 1 | xargs dirname)
              if [ -n "$SUBDIR" ]; then
                mv "$SUBDIR"/* . 2>/dev/null || true
              fi
            fi
            rm -rf extracted
          fi
          ls -la

      # 2. Java 17 Setup (Flet/Android ke liye zaroori)
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Python Setup
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 4. System Dependencies Install karo
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsqlite3-dev portaudio19-dev libasound2-dev libffi-dev libssl-dev zip unzip

      # 5. Requirements aur Python Packages install karo
      - name: Create requirements and Install packages
        run: |
          cat << 'EOF' > requirements.txt
          flet==0.24.1
          groq==0.11.0
          SpeechRecognition==3.10.4
          pyttsx3==2.98
          gTTS==2.5.1
          pygame==2.6.1
          python-dotenv==1.0.1
          Pillow
          EOF

          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 6. Icons Setup
      - name: Setup Icons
        run: |
          if [ ! -d "assets" ]; then mkdir -p assets; fi
          if [ ! -f "assets/logo.png" ]; then
            python -c "from PIL import Image, ImageDraw; img = Image.new('RGBA', (1024, 1024), (10, 14, 26, 255)); d = ImageDraw.Draw(img); d.ellipse([112, 112, 912, 912], fill='#0a0e1a', outline='#00d4ff', width=16); d.ellipse([320, 400, 460, 540], fill='#00d4ff'); d.ellipse([564, 400, 704, 540], fill='#00d4ff'); d.rectangle([400, 680, 624, 720], fill='#00d4ff'); d.line([512, 112, 512, 40], fill='#00d4ff', width=12); d.ellipse([492, 12, 532, 52], fill='#00d4ff'); img.save('assets/logo.png')"
          fi
          python -c "from PIL import Image; img = Image.open('assets/logo.png').convert('RGBA'); img = img.resize((1024, 1024), Image.LANCZOS); img.save('assets/logo.png')"
          cp assets/logo.png assets/icon.png

      # 7. Build Command (Flutter fix ke sath)
      - name: Build APK
        run: |
          export FLUTTER_ROOT=$(which flutter) # Safety line
          flet build apk \
            --project "jarvis_v2" \
            --org "com.dina.jarvis" \
            --product "JARVIS V2" \
            --build-version "2.0.0" \
            --verbose

      # 8. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-V2-APK
          path: build/apk/*.apk
          if-no-files-found: error
